<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - KAKAO</title>

    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="login-page">

        <section class="login-left">

            <div class="login-brand">
                <a href="../index/index.html">KAKAO</a>

                <p>
                    SISTEM INFORMASI<br>
                    PRODUSEN KAKAO
                </p>
            </div>


            <div class="login-info">

                <p class="section-label">
                    SISTEM INFORMASI PRODUSEN KAKAO
                </p>

                <h1>
                    Kelola kakao
                    <span>lebih terstruktur.</span>
                </h1>

                <p>
                    Masuk untuk mengelola produk, pesanan,
                    dan informasi produsen kakao.
                </p>

            </div>

        </section>


        <section class="login-right">

            <div class="login-box">

                <div class="login-heading">

                    <p class="section-label">
                        SELAMAT DATANG
                    </p>

                    <h2>Login</h2>

                    <p>
                        Masukkan akun untuk melanjutkan.
                    </p>

                </div>


                <form id="loginForm">

                    <div class="form-group">

                        <label for="username">
                            Username
                        </label>

                        <input
                            type="text"
                            id="username"
                            placeholder="Masukkan username"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            placeholder="Masukkan password"
                            required
                        >

                    </div>


                    <div class="form-option">

                        <label>
                            <input type="checkbox" id="remember">
                            Ingat saya
                        </label>

                        <a href="#">
                            Lupa password?
                        </a>

                    </div>


                    <button type="submit">
                        Masuk
                    </button>

                    <p id="message"></p>

                </form>


                <div class="back-home">
                    <a href="../../frontend/home/index.html">
                        ← Kembali ke halaman utama
                    </a>
                </div>

            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
