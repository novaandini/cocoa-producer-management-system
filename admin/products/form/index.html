<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Admin Form</title>
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<aside class="sidebar">
			<div class="sidebar-logo">
				<a href="../../frontend/home/index.html">KAKAO</a>
				<p>SISTEM INFORMASI<br />PRODUSEN KAKAO</p>
			</div>

			<nav class="sidebar-menu">
			<a href="../dashboard/index.html">Dashboard</a>
			<a href="../index/index.html">Produk</a>
			<a href="index.html" class="active">Tambah Produk</a>
			<a href="#">Pesanan</a>
			<a href="#">Customer</a>
			</nav>
		</aside>

		<header class="topbar">
			<div>
				<p class="topbar-label">ADMIN AREA</p>
				<h1>Form</h1>
			</div>

			<div class="admin-info">
				<strong>Admin KAKAO</strong>
				<span>Administrator</span>
			</div>
		</header>

		<main>

			<div class="page-heading">
				<div>
					<h1>Produk</h1>
					<div class="breadcrumb"><span>Admin</span><span>›</span><strong>Produk</strong></div>
				</div>
			</div>

			<section class="form-card">
				<form action="" method="post" id="form" class="form">
					<!-- Kode Produk -->
					<div class="input-text">
						<label for="product_code">Kode Produk</label>
						<input type="text" name="product_code" id="product_code" />
					</div>

					<!-- Nama Produk -->
					<div class="input-text">
						<label for="product_name">Nama Produk</label>
						<input type="text" name="product_name" id="product_name" />
					</div>

					<!-- Kategori -->
					<div class="form-group">
						<label for="category">Kategori</label>
						<select name="category" id="category">
							<option value="">-- Pilih Kategori --</option>
							<option value="fermentasi">Fermentasi</option>
							<option value="non-fermentasi">Non-Fermentasi</option>
						</select>
					</div>

					<!-- Grade -->
					<div class="form-group">
						<label for="grade">Grade</label>
						<select name="grade" id="grade">
							<option value="">-- Pilih Grade --</option>
							<option value="a">Grade A</option>
							<option value="b">Grade B</option>
							<option value="c">Grade C</option>
						</select>
					</div>

					<!-- Deskripsi -->
					<div class="form-group">
						<label for="description">Deskripsi</label>
						<textarea 
							name="description" 
							id="description" 
							rows="5" 
							cols="30"
							placeholder="Tulis deskripsi di sini..."
						></textarea>
					</div>
					
					<!-- Image -->
					<div class="input-file">
						<label for="image">Gambar</label>
						<input type="file" name="image" id="image" />
					</div>

					<!-- Tombol -->
					<div class="form-buttons">
						<button type="submit">Submit</button>
						<button type="reset">Reset</button>
					</div>
				</form>
			</section>
			<!-- </section> -->
		</main>

		<footer>
			<p>© 2026 KAKAO</p>
			<p>Sistem Informasi Penjualan dan Pemesanan Kakao</p>
		</footer>

		<!-- script harus paling bawah -->
		<script src="script.js"></script>
	</body>
</html>
