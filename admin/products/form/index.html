<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Admin Form</title>
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<aside class="sidebar">
			<div class="sidebar-logo">
				<a href="../../../frontend/home/index.html">KAKAO</a>
				<p>SISTEM INFORMASI<br />PRODUSEN KAKAO</p>
			</div>

			<nav class="sidebar-menu">
                <a href="../../dashboard/index.html">Dashboard</a>
                <a href="../../accounts/list/index.html">Pelanggan</a>
                <a href="" class="active">Produk</a>
                <a href="../../pesanan/index.html">Pesanan</a>
                <a href="../../payments/list/index.html">Pembayaran</a>
				<a href="../../shipping/list/index.html">Pengiriman</a>
            </nav>
		</aside>

		<header class="topbar">
			<div>
				<p class="topbar-label">ADMIN AREA</p>
				<h1>Form</h1>
			</div>

			<div class="admin-info">
				<strong>Admin KAKAO</strong>
				<span>Administrator</span>
			</div>
		</header>

		<main>

			<section class="form-card">
				<div class="page-heading">
					<div>
						<h1>Produk</h1>
						<div class="breadcrumb"><span>Admin</span><span>›</span><strong>Produk</strong></div>
					</div>
				</div>

				<form action="" method="post" id="form" class="form">
					<!-- Kode Produk -->
					<div class="input-text">
						<label for="product_code">Kode Produk</label>
						<input type="text" name="product_code" id="product_code" />
					</div>

					<!-- Nama Produk -->
					<div class="input-text">
						<label for="product_name">Nama Produk</label>
						<input type="text" name="product_name" id="product_name" />
					</div>

					<!-- Tipe Produk -->
					<div class="form-group">
						<label for="product_type">Tipe Produk</label>
						<select name="product_type" id="product_type">
							<option value="">-- Pilih Tipe Produk --</option>
							<option value="fermented">Fermentasi</option>
							<option value="non_fermented">Non-Fermentasi</option>
						</select>
					</div>

					<!-- Grade -->
					<div class="form-group">
						<label for="grade">Grade</label>
						<select name="grade" id="grade">
							<option value="">-- Pilih Grade --</option>
							<option value="A">Grade A</option>
							<option value="B">Grade B</option>
							<option value="C">Grade C</option>
						</select>
					</div>
					
					<!-- Harga per KG -->
					<div class="input-text">
						<label for="price_per_kg">Harga per KG</label>
						<input type="number" name="price_per_kg" id="price_per_kg" step="0.01" />
					</div>
					
					<!-- Image -->
					<div class="input-file">
						<label for="image">Gambar</label>
					<input type="file" name="image" id="image" accept="image/*" />
					</div>

					<!-- Deskripsi -->
					<div class="form-group">
						<label for="description">Deskripsi</label>
						<textarea 
							name="description" 
							id="description" 
							rows="5" 
							cols="30"
							placeholder="Tulis deskripsi di sini..."
						></textarea>
					</div>

					<!-- Status -->
					<div class="form-group">
						<label for="is_active">Status</label>
						<select name="is_active" id="is_active">
							<option value="">-- Pilih Status --</option>
							<option value="1">Aktif</option>
							<option value="0">Tidak Aktif</option>
						</select>
					</div>

					<!-- Tombol -->
					<div class="form-buttons">
						<button type="submit">Submit</button>
						<button type="reset">Reset</button>
					</div>

					<p id="storeMessage" class="form-message" role="status"></p>
				</form>
			</section>
			<!-- </section> -->
		</main>

		<footer>
			<p>© 2026 KAKAO</p>
			<p>Sistem Informasi Penjualan dan Pemesanan Kakao</p>
		</footer>

		<!-- script harus paling bawah -->
    <script src="../../shared/auth.js"></script>
    <script src="script.js"></script>
	</body>
</html>
