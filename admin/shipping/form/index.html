<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Admin Form</title>
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<aside class="sidebar">
			<div class="sidebar-logo">
				<a href="../../../frontend/home/index.html">KAKAO</a>
				<p>SISTEM INFORMASI<br />PRODUSEN KAKAO</p>
			</div>

			<nav class="sidebar-menu">
                <a href="../../dashboard/index.html">Dashboard</a>
                <a href="../../accounts/list/index.html">Pelanggan</a>
                <a href="../../products/list/index.html">Produk</a>
                <a href="../../pesanan/index.html">Pesanan</a>
                <a href="../../payments/list/index.html">Pembayaran</a>
				<a href="../../shipping/list/index.html"  class="active">Pengiriman</a>
            </nav>
		</aside>

		<header class="topbar">
			<div>
				<p class="topbar-label">ADMIN AREA</p>
				<h1>Form</h1>
			</div>

			<div class="admin-info">
				<strong>Admin KAKAO</strong>
				<span>Administrator</span>
			</div>
		</header>

		<main>

			<section class="form-card">
				<div class="page-heading">
					<div>
						<h1>Pengiriman</h1>
						<div class="breadcrumb"><span>Admin</span><span>›</span><strong>Pengiriman</strong></div>
					</div>
				</div>
			
				<form action="" method="post" id="form" class="form">
					<!-- ID Pemesanan -->
					<div class="form-group">
						<label for="order_id">ID Pemesanan</label>
						<input type="text" name="order_id" id="order_id" />
					</div>

					<!-- Nama Pemesan -->
					<div class="input-text">
						<label for="name">Nama Pemesan</label>
						<input type="text" name="name" id="name" />
					</div>

					<!-- Email -->
					<div class="input-text">
						<label for="email">Email Pemesan</label>
						<input type="email" name="email" id="email" />
					</div>

					<!-- Nomor Telepon -->
					<div class="input-text">
						<label for="phone_number">Nomor Telepon Pemesan</label>
						<input type="text" name="phone_number" id="phone_number" />
					</div>

					<!-- Nomor Pelacakan -->
					<div class="input-text">
						<label for="tracking_number">Nomor Pelacakan</label>
						<input type="text" name="tracking_number" id="tracking_number" />
					</div>

					<!-- Status -->
					<div class="form-group">
						<label for="order_id">ID Pemesanan</label>
						<select name="order_id" id="order_id">
							<option value="">-- Pilih Status Pemesanan --</option>
							<option value="delivered">Terkirim</option>
							<option value="in_transit">Dalam Transit</option>
							<option value="shipped">Sudah Terkirim</option>
							<option value="processing">Proses Pengemasan</option>
						</select>
					</div>

					<!-- Tanggal Pengiriman -->
					<div class="input-date">
						<label for="shipped_date">Tanggal Pengiriman</label>
						<input type="date" name="shipped_date" id="shipped_date" />
					</div>

					<!-- Estimasi Selesai -->
					<div class="input-date">
						<label for="estimated_delivery">Estimasi Selesai</label>
						<input type="date" name="estimated_delivery" id="estimated_delivery" />
					</div>

					<!-- Tombol -->
					<div class="form-buttons">
						<button type="submit">Submit</button>
						<button type="reset">Reset</button>
					</div>
				</form>
			</section>
			<!-- </section> -->
		</main>

		<footer>
			<p>© 2026 KAKAO</p>
			<p>Sistem Informasi Penjualan dan Pemesanan Kakao</p>
		</footer>

		<!-- script harus paling bawah -->
		<script src="script.js"></script>
	</body>
</html>
